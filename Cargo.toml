[package]
name = "voice"
version = "0.4.0"
edition = "2024"
description = "A local vocal practice workbench"

[features]
default = ["desktop"]
desktop = ["dep:gpui", "dep:futures-channel", "dep:raw-window-handle", "dep:objc2", "dep:block2", "dep:objc2-foundation", "dep:objc2-app-kit", "dep:objc2-av-foundation", "dep:objc2-uniform-type-identifiers"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
cpal = "=0.18.2"
symphonia = { version = "0.5.5", features = ["all"] }
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
gpui = { version = "=0.2.2", optional = true }
futures-channel = { version = "0.3", optional = true }
raw-window-handle = { version = "0.6.2", optional = true }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "download-binaries", "copy-dylibs"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", optional = true }
block2 = { version = "0.6.2", optional = true }
objc2-foundation = { version = "0.3.2", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true, features = ["objc2-uniform-type-identifiers"] }
objc2-av-foundation = { version = "0.3.2", optional = true }
objc2-uniform-type-identifiers = { version = "0.3.2", optional = true }

[[bin]]
name = "voice"
path = "src/main.rs"
required-features = ["desktop"]

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = "debuginfo"
